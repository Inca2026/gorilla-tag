<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Gorilla Tag Web</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Unity Container -->
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="gtag-loading">
      <div id="gtag-load-status">GORILLA OS BOOTING...</div>
      <div class="gtag-bar-outer"><div id="gtag-bar-inner"></div></div>
    </div>
  </div>

  <!-- On-Screen Keybind Reminder -->
  <div id="gtag-hud-hint">[TAB] TERMINAL | [T] CHAT | [M] MUSIC</div>

  <!-- Custom Gorilla Tag Stump Computer Overlay -->
  <div id="gtag-overlay" class="gtag-hidden">
    <div class="gtag-terminal">
      <div class="gtag-header">
        <span>GORILLA OS v1.5 // [TAB] CLOSE</span>
        <div>
          <button id="btn-tab-chat" class="gtag-btn active" onclick="switchTab('chat')">CHAT</button>
          <button id="btn-tab-music" class="gtag-btn" onclick="switchTab('music')">MUSIC</button>
        </div>
      </div>

      <!-- Messaging Interface (Element / Matrix Default Room) -->
      <div id="tab-chat">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:8px; color:#888;">
          <span id="matrix-room-label">ROOM: #gorillatag:matrix.org</span>
          <a href="https://element.io" target="_blank" style="color:#33ff33; text-decoration:none;">[OPEN IN ELEMENT]</a>
        </div>
        <div id="chat-messages">
          <div class="chat-line" style="color:#888;">* BOOTING ELEMENT RELAY *</div>
        </div>
        <div class="gtag-input-row">
          <span>&gt;</span>
          <input type="text" id="chat-input" placeholder="TYPE MESSAGE + ENTER..." maxlength="120" autocomplete="off" />
        </div>
      </div>

      <!-- Music Interface (SoundCloud + YouTube - Full Tracks, No Login) -->
      <div id="tab-music" class="gtag-hidden">
        <!-- Preset Gorilla Tag / Lo-Fi / Phonk Stations -->
        <div style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; justify-content:center;">
          <button class="gtag-btn" onclick="loadPresetMusic('gtag')">GTAG OST</button>
          <button class="gtag-btn" onclick="loadPresetMusic('lofi')">LO-FI BEATS</button>
          <button class="gtag-btn" onclick="loadPresetMusic('phonk')">PHONK</button>
        </div>

        <!-- SoundCloud / YouTube Player Frame -->
        <iframe id="music-embed" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay"
          style="border:2px solid #33ff33; margin-bottom:10px; background:#000;"
          src="https://soundcloud.com">
        </iframe>

        <!-- Paste any SoundCloud or YouTube Link -->
        <div class="gtag-input-row">
          <span>&gt;</span>
          <input type="text" id="music-link-input" placeholder="PASTE SOUNDCLOUD OR YOUTUBE URL..." autocomplete="off" />
          <button class="gtag-btn" onclick="loadCustomMusic()">PLAY</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modular Scripts -->
  <script src="ui-keybinds.js"></script>
  <script src="music.js"></script>
  <script type="module" src="chat.js"></script>

  <!-- Unity 8-Part Loader -->
  <script>
    const buildUrl = "Build";
    const statusText = document.getElementById("gtag-load-status");
    const progressBar = document.getElementById("gtag-bar-inner");

    async function mergeDataParts() {
      const totalParts = 8;
      const chunks = [];
      for (let i = 1; i <= totalParts; i++) {
        statusText.textContent = `LOADING DATA PART ${i}/${totalParts}...`;
        const response = await fetch(`${buildUrl}/gtagwebR2.data.unityweb.part${i}`);
        if (!response.ok) throw new Error(`Missing part ${i} (${response.status})`);
        chunks.push(await response.arrayBuffer());
        progressBar.style.width = ((i / totalParts) * 60) + "%";
      }
      statusText.textContent = "ASSEMBLING GORILLA DATA...";
      return URL.createObjectURL(new Blob(chunks, { type: "application/octet-stream" }));
    }

    async function bootUnity() {
      try {
        const mergedDataUrl = await mergeDataParts();
        const config = {
          dataUrl: mergedDataUrl,
          frameworkUrl: `${buildUrl}/gtagwebR2.framework.js.unityweb`,
          codeUrl: `${buildUrl}/gtagwebR2.wasm.unityweb`,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "gorilla tag web",
          productVersion: "1.0",
        };

        const script = document.createElement("script");
        script.src = `${buildUrl}/gtagwebR2.loader.js`;
        script.onload = () => {
          statusText.textContent = "STARTING ENGINE...";
          createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
            progressBar.style.width = (60 + (progress * 40)) + "%";
          }).then(() => {
            document.querySelector("#gtag-loading").style.display = "none";
          }).catch((msg) => alert("Unity Error: " + msg));
        };
        document.body.appendChild(script);
      } catch (err) {
        statusText.textContent = "BOOT ERROR: " + err.message;
      }
    }
    bootUnity();
  </script>
</body>
</html>
