<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Gorilla Tag Web</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Unity Container -->
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="gtag-loading">
      <div id="gtag-load-status">GORILLA OS BOOTING...</div>
      <div class="gtag-bar-outer"><div id="gtag-bar-inner"></div></div>
    </div>
  </div>

  <!-- On-Screen Keybind Reminder -->
  <div id="gtag-hud-hint">[TAB] TERMINAL | [T] CHAT | [M] MUSIC</div>

  <!-- Custom Gorilla Tag Stump Computer Overlay -->
  <div id="gtag-overlay" class="gtag-hidden">
    <div class="gtag-terminal">
      <div class="gtag-header">
        <span>GORILLA OS v1.4 // [TAB] CLOSE</span>
        <div>
          <button id="btn-tab-chat" class="gtag-btn active" onclick="switchTab('chat')">CHAT</button>
          <button id="btn-tab-music" class="gtag-btn" onclick="switchTab('music')">MUSIC</button>
        </div>
      </div>

      <!-- Messaging Interface -->
      <div id="tab-chat">
        <div id="chat-messages">
          <div class="chat-line" style="color:#888;">* CONNECTED TO STUMP NETWORK *</div>
        </div>
        <div class="gtag-input-row">
          <span>&gt;</span>
          <input type="text" id="chat-input" placeholder="TYPE MESSAGE + ENTER..." maxlength="120" autocomplete="off" />
        </div>
      </div>

      <!-- Spotify Music Interface -->
      <div id="tab-music" class="gtag-hidden">
        <!-- Built-in Spotify Player (Works immediately with no API key) -->
        <iframe id="spotify-embed" style="border-radius:6px; border:2px solid #33ff33; margin-bottom:10px;" 
          src="https://spotify.com" 
          width="100%" height="152" frameBorder="0" allowfullscreen="" 
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
        </iframe>

        <!-- Paste any Spotify Song/Playlist Link -->
        <div class="gtag-input-row" style="margin-bottom:12px;">
          <span>&gt;</span>
          <input type="text" id="spotify-link-input" placeholder="PASTE SPOTIFY LINK..." autocomplete="off" />
          <button class="gtag-btn" onclick="loadCustomSpotifyLink()">LOAD</button>
        </div>

        <!-- Optional Spotify Premium Full-Track SDK Controls -->
        <button id="spotify-login-btn" class="gtag-btn" onclick="loginWithSpotify()">CONNECT SPOTIFY PREMIUM SDK</button>
        <div id="spotify-controls" class="gtag-hidden">
          <div id="track-info">READY - SELECT "GORILLA TAG WEB" IN SPOTIFY</div>
          <div class="gtag-btn-group">
            <button class="gtag-btn" onclick="spotifyAction('previous')">|&lt;&lt; PREV</button>
            <button class="gtag-btn" onclick="spotifyAction('playpause')">PLAY/PAUSE</button>
            <button class="gtag-btn" onclick="spotifyAction('next')">NEXT &gt;&gt;|</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- External & Modular Scripts -->
  <script src="https://scdn.co"></script>
  <script src="https://unpkg.com"></script>
  <script src="ui-keybinds.js"></script>
  <script src="spotify.js"></script>
  <script type="module" src="chat.js"></script>

  <!-- Unity 8-Part Loader -->
  <script>
    const buildUrl = "Build";
    const statusText = document.getElementById("gtag-load-status");
    const progressBar = document.getElementById("gtag-bar-inner");

    async function mergeDataParts() {
      const totalParts = 8;
      const chunks = [];
      for (let i = 1; i <= totalParts; i++) {
        statusText.textContent = `LOADING DATA PART ${i}/${totalParts}...`;
        const response = await fetch(`${buildUrl}/gtagwebR2.data.unityweb.part${i}`);
        if (!response.ok) throw new Error(`Missing part ${i} (${response.status})`);
        chunks.push(await response.arrayBuffer());
        progressBar.style.width = ((i / totalParts) * 60) + "%";
      }
      statusText.textContent = "ASSEMBLING GORILLA DATA...";
      return URL.createObjectURL(new Blob(chunks, { type: "application/octet-stream" }));
    }

    async function bootUnity() {
      try {
        const mergedDataUrl = await mergeDataParts();
        const config = {
          dataUrl: mergedDataUrl,
          frameworkUrl: `${buildUrl}/gtagwebR2.framework.js.unityweb`,
          codeUrl: `${buildUrl}/gtagwebR2.wasm.unityweb`,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "gorilla tag web",
          productVersion: "1.0",
        };

        const script = document.createElement("script");
        script.src = `${buildUrl}/gtagwebR2.loader.js`;
        script.onload = () => {
          statusText.textContent = "STARTING ENGINE...";
          createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
            progressBar.style.width = (60 + (progress * 40)) + "%";
          }).then(() => {
            document.querySelector("#gtag-loading").style.display = "none";
          }).catch((msg) => alert("Unity Error: " + msg));
        };
        document.body.appendChild(script);
      } catch (err) {
        statusText.textContent = "BOOT ERROR: " + err.message;
      }
    }
    bootUnity();
  </script>
</body>
</html>
